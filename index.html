<!doctype html>
<!--
  index.html - the worker practice app (the page served at https://kartak-app.vercel.app/).

  Purpose:    Static shell only: head tags (icons, manifest, fonts), the header with the language switch,
              and the two empty containers (#app for the screens, #bar for the bottom button bar).
              Every screen is drawn by js/app.js; all wording lives in js/i18n.js; the questions are
              loaded from data/questions.json.
  Depends on: css/app.css, js/i18n.js, js/app.js, manifest.webmanifest, icons/, sw.js (registered by app.js).
  Notes:      The one-line script sends visitors of the old GitHub Pages address to Vercel (decision D8).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartak Practice Test</title>
<script>if (/github\.io$/.test(location.hostname)) location.replace("https://kartak-app.vercel.app/");</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0A6B4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kartak">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Bengali:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="page">
  <header class="top">
    <button class="brand" type="button" id="brandBtn" aria-label="Kartak">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="8" fill="var(--primary)"/><path d="M8 14.5l4 4 8-9" fill="none" stroke="var(--primary-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b>Kartak</b>
    </button>
    <div class="langs" role="group" aria-label="Language" id="langs">
      <button type="button" class="en" data-lang="en">EN</button>
      <button type="button" class="ur" data-lang="ur">اردو</button>
      <button type="button" class="hi" data-lang="hi">हिंदी</button>
      <button type="button" class="bn" data-lang="bn">বাংলা</button>
    </div>
  </header>
  <main id="app" class="page" aria-live="polite"></main>
</div>
<div class="bar" id="bar"></div>

<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
