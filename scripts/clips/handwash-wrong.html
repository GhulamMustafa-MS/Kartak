<!doctype html>
<!--
  scripts/clips/handwash-wrong.html - draws the "hand washing done wrong" clip (WRONG), one frame at a time.

  Purpose:    window.render(t) draws the scene at t seconds (0-9) on a 1280x720 canvas: at the same hand-wash sink
              the worker only splashes water on the hands for a moment, never touches the soap (no lather), wipes the
              wet hands on the apron instead of a paper towel and goes back to the work counter.
              Handbook: wash at least 20 seconds with warm water and liquid soap, dry with a paper towel.
  Used by:    scripts/make-clip.mjs, which saves the frames and joins them into videos/handwash-wrong.mp4.
  Depends on: lib.js, handwash-scene.js.
-->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script src="handwash-scene.js"></script>
<script>
// ---------- the timeline (seconds) ----------
// 0.0-0.5 rest | 0.5-1.1 tap on | 1.1-2.0 quick splash, no soap | 2.0-2.5 tap off | 2.5-3.4 step left (clear of
// the sink, hands dripping) | 3.4-5.4 wipe the hands on the apron | 5.4-7.6 on to the work counter, hands to the board
// 7.6-9 hold
const REST_L = { x: 584, y: 506 }, REST_R = { x: 698, y: 506 };
const UNDER_L = { x: 624, y: 464 }, UNDER_R = { x: 660, y: 464 };
const APRON_L = { x: 606, y: 350 }, APRON_R = { x: 674, y: 350 };   // on the apron, in the body's own position
const CLOCK_RATE = 0.26, STEP1 = -240, WALK = -300;

function flowAt(t) { return t < 1.0 ? 0 : t < 1.15 ? ph(t, 1.0, 1.15) : t < 2.35 ? 1 : 1 - ph(t, 2.35, 2.5); }
function leverAt(t) { return t < 0.9 ? 0 : t < 1.1 ? ease(ph(t, 0.9, 1.1)) : t < 2.3 ? 1 : 1 - ease(ph(t, 2.3, 2.5)); }

// wet smears left on the apron by the hands (k = 0..1 how much has been wiped)
function wetMarks(k, t) {
  if (k <= 0) return;
  [[608, 0], [672, 1]].forEach(([x, i]) => {
    const len = 24 + k * 84;
    g.fillStyle = "rgba(10,16,22,.65)"; g.beginPath();
    g.moveTo(x - 22, 338); g.quadraticCurveTo(x, 330, x + 22, 338); g.lineTo(x + 18 + i * 4, 338 + len); g.quadraticCurveTo(x, 346 + len, x - 18, 338 + len - 6); g.closePath(); g.fill();
    g.strokeStyle = "rgba(140,200,240,.75)"; g.lineWidth = 3; g.lineCap = "round";
    for (let s = 0; s < 3; s++) { g.beginPath(); g.moveTo(x - 11 + s * 11, 346 + s * 4); g.lineTo(x - 11 + s * 11, 334 + len * (0.7 + 0.1 * s)); g.stroke(); }
  });
}

function render(t) {
  camera();
  const lever = leverAt(t), flow = flowAt(t);
  const dx = lerp(0, STEP1, ease(ph(t, 2.5, 3.4))) + lerp(0, WALK - STEP1, ease(ph(t, 5.4, 7.2)));

  wallAndFloor();
  clock(0.4 + t * CLOCK_RATE, t > 1.0 ? [0.4 + 1.0 * CLOCK_RATE, 0.4 + Math.min(t, 2.45) * CLOCK_RATE] : null);
  workCounter();
  soapDispenser(0);                 // never touched
  towelDispenser(0, false);         // never touched
  bin(0, 0, null);

  // legs: small steps while walking left
  const step = t > 2.5 && t < 3.4 ? Math.sin((t - 2.5) / 0.9 * Math.PI * 2) : t > 5.4 && t < 7.2 ? Math.sin((t - 5.4) / 0.9 * Math.PI * 2) : 0;
  g.save(); g.translate(dx, 0);
  legs({ x: FOOT_R.x, y: FOOT_R.y - Math.max(0, step) * 16 }, { x: FOOT_L.x, y: FOOT_L.y - Math.max(0, -step) * 16 });
  person(t);
  wetMarks(ph(t, 3.5, 5.2), t);
  g.restore();
  basin();

  // ---- hands (world positions) ----
  let lh = REST_L, rh = REST_R, wet = false;
  if (t < 0.5) { /* rest */ }
  else if (t < 1.1) {
    const tip = leverTip(lever);
    rh = t < 0.9 ? L(REST_R, { x: leverTip(0).x + 4, y: leverTip(0).y + 4 }, ease(ph(t, 0.5, 0.9))) : { x: tip.x + 4, y: tip.y + 4 };
  } else if (t < 2.0) {
    const k = ease(ph(t, 1.1, 1.35)) * (1 - ease(ph(t, 1.75, 2.0)));
    lh = L(REST_L, UNDER_L, k);
    rh = L({ x: leverTip(1).x + 4, y: leverTip(1).y + 4 }, UNDER_R, k);
    wet = t > 1.3;
  } else if (t < 2.5) {
    wet = true; lh = REST_L;
    const tip = leverTip(lever);
    rh = t < 2.3 ? L(L({ x: leverTip(1).x + 4, y: leverTip(1).y + 4 }, UNDER_R, 0), { x: leverTip(1).x + 4, y: leverTip(1).y - 2 }, ease(ph(t, 2.0, 2.3))) : { x: tip.x + 4, y: tip.y - 2 };
  } else if (t < 5.4) {
    // step left clear of the sink, then rub the wet hands up and down the apron
    wet = t < 4.6;
    const k = ease(ph(t, 2.5, 3.4)), s = (1 - Math.cos((t - 3.4) * Math.PI * 2 * 1.25)) / 2;
    const wipe = t < 3.4 ? 0 : s * 80;
    lh = L(REST_L, { x: APRON_L.x + dx, y: APRON_L.y + wipe }, k);
    rh = L({ x: leverTip(0).x + 4, y: leverTip(0).y - 2 }, { x: APRON_R.x + dx, y: APRON_R.y + wipe }, k);
  } else {
    // on to the work counter, hands to the board
    const b = ease(ph(t, 5.4, 7.4));
    lh = L({ x: APRON_L.x + STEP1, y: APRON_L.y }, { x: 96, y: 478 }, b);
    rh = L({ x: APRON_R.x + STEP1, y: APRON_R.y }, { x: 176, y: 472 }, b);
  }

  let yEnd = SINK.y + 8;
  [lh, rh].forEach((p) => { if (Math.abs(p.x - SPOUT.x) < 26 && p.y > SPOUT.y && p.y - 22 < yEnd) yEnd = p.y - 22; });
  water(flow, t, yEnd);
  tap(lever);

  const LSw = { x: LS.x + dx, y: LS.y }, RSw = { x: RS.x + dx, y: RS.y };
  arm(LSw, lh, -1); arm(RSw, rh, 1);
  bigHand(LSw, lh, -1, { wet }); bigHand(RSw, rh, 1, { wet });
  if (flow > 0.5 && yEnd < SINK.y) splash(SPOUT.x, yEnd + 6, t, 10, 50);
  // drops falling from the wet hands on the way to the apron
  if (t > 2.0 && t < 4.4) { drips(lh.x, lh.y, t, 3, 0); drips(rh.x, rh.y, t, 3, 50); }
}
window.render = render;
render(0);
</script></body></html>
