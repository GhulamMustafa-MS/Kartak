<!doctype html>
<!--
  scripts/clips/taste-wrong.html - draws the "tasting with a finger" clip (the WRONG way), one frame at a time.

  Purpose:    window.render(t) draws the scene at t seconds (0-9.5) on a 1280x720 canvas: the worker stirs a pot of
              sauce, dips a finger in it, licks the finger, then puts the same finger back into the pot. The one
              mistake: tasting with a finger and putting it back (handbook: never lick fingers or taste with fingers;
              taste with a clean spoon used once). Clean teaspoons and a used-spoon bowl stand ready but are not used.
  Used by:    scripts/make-clip.mjs, which saves the frames and joins them into videos/taste-wrong.mp4.
  Depends on: scripts/clips/lib.js (kitchen, worker, arms, hands). The pot, spoons and bowls are drawn here
              (same shapes as taste-right.html).
-->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script>
// ---- the pot scene (shared shape with the other taste clip) ----
const POT = { x: 640, y: 450, rx: 200, ry: 42, bottom: 598 };
const SAUCE = { x: 640, y: 458, rx: 184, ry: 32, c: "#C8452B", light: "#E0694A" };
const GLASS = { x: 935, y: 500 };          // glass of clean teaspoons (bottom centre)
const USED = { x: 1062, y: 566 };          // bowl for used teaspoons
const LS = { x: 560, y: 290 }, RS = { x: 720, y: 290 };
const HANDLE_L = { x: 428, y: 482 };
// the camera is a little closer than in the board clips, so the hands, mouth and spoon read on a phone
const ZOOM = 1.25, ZC = { x: 640, y: 300 };
function zoom() { g.setTransform(ZOOM, 0, 0, ZOOM, ZC.x * (1 - ZOOM), ZC.y * (1 - ZOOM)); }
const mouthAt = (t) => ({ x: 640 + Math.sin(t * 2.1) * 2, y: 216 });

function hob() {
  g.fillStyle = "#2E3438"; rr(400, 584, 480, 24, 8); g.fill();
  g.fillStyle = "#1E2326"; g.fillRect(410, 604, 460, 6);
}
function potBack() {
  // pot body (front wall), then the open top with the sauce inside
  const body = g.createLinearGradient(POT.x - POT.rx, 0, POT.x + POT.rx, 0);
  body.addColorStop(0, "#8C979C"); body.addColorStop(0.45, "#E8EDEF"); body.addColorStop(1, "#808B90");
  g.fillStyle = body; g.beginPath();
  g.moveTo(POT.x - POT.rx, POT.y); g.lineTo(POT.x - POT.rx + 8, POT.bottom - 14);
  g.quadraticCurveTo(POT.x, POT.bottom + 14, POT.x + POT.rx - 8, POT.bottom - 14); g.lineTo(POT.x + POT.rx, POT.y); g.closePath(); g.fill();
  // side handles
  g.fillStyle = "#4A5358";
  rr(POT.x - POT.rx - 34, 470, 40, 22, 8); g.fill(); rr(POT.x + POT.rx - 6, 470, 40, 22, 8); g.fill();
  // rim and inside
  g.fillStyle = "#B9C2C6"; g.beginPath(); g.ellipse(POT.x, POT.y, POT.rx, POT.ry, 0, 0, 7); g.fill();
  g.fillStyle = "#6E787C"; g.beginPath(); g.ellipse(POT.x, POT.y + 2, POT.rx - 10, POT.ry - 7, 0, 0, 7); g.fill();
  sauceSurface();
}
function sauceSurface() {
  g.fillStyle = SAUCE.c; g.beginPath(); g.ellipse(SAUCE.x, SAUCE.y, SAUCE.rx, SAUCE.ry, 0, 0, 7); g.fill();
  g.fillStyle = "rgba(255,255,255,.12)"; g.beginPath(); g.ellipse(SAUCE.x - 50, SAUCE.y - 8, 70, 9, 0, 0, 7); g.fill();
}
function steam(t) {
  g.strokeStyle = "rgba(255,255,255,.75)"; g.lineWidth = 6; g.lineCap = "round";
  [540, 760].forEach((x0, i) => {
    g.beginPath();
    for (let k = 0; k <= 12; k++) {
      const y = 430 - k * 9, x = x0 + Math.sin(k * 0.7 + t * 3 + i) * 8;
      if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  });
}
// where something goes into the sauce: cover its end with a little ring of sauce
function ripple(p, big = 1) {
  g.fillStyle = SAUCE.c; g.beginPath(); g.ellipse(p.x, p.y + 2, 26 * big, 8 * big, 0, 0, 7); g.fill();
  g.strokeStyle = SAUCE.light; g.lineWidth = 3; g.beginPath(); g.ellipse(p.x, p.y + 2, 30 * big, 10 * big, 0, 0, 7); g.stroke();
}

// long wooden cooking spoon from the grip to its bowl (tip)
function cookSpoon(grip, tip) {
  g.lineCap = "round";
  g.strokeStyle = "#8A5A2B"; g.lineWidth = 14; g.beginPath(); g.moveTo(grip.x, grip.y); g.lineTo(tip.x, tip.y); g.stroke();
  g.strokeStyle = "#B07A40"; g.lineWidth = 8; g.beginPath(); g.moveTo(grip.x, grip.y); g.lineTo(tip.x, tip.y); g.stroke();
  const a = Math.atan2(tip.y - grip.y, tip.x - grip.x);
  g.fillStyle = "#A36D37"; g.beginPath(); g.ellipse(tip.x, tip.y, 26, 15, a, 0, 7); g.fill();
}
// teaspoon: big enough to see on a phone; bowl at `bowl`, handle pointing back along angle a (radians, bowl direction)
function teaspoon(bowlP, a, full) {
  const hx = bowlP.x - Math.cos(a) * 118, hy = bowlP.y - Math.sin(a) * 118;
  g.lineCap = "round";
  g.strokeStyle = "#8D979B"; g.lineWidth = 9; g.beginPath(); g.moveTo(hx, hy); g.lineTo(bowlP.x - Math.cos(a) * 20, bowlP.y - Math.sin(a) * 20); g.stroke();
  g.strokeStyle = "#E3E8EA"; g.lineWidth = 5; g.beginPath(); g.moveTo(hx, hy); g.lineTo(bowlP.x - Math.cos(a) * 20, bowlP.y - Math.sin(a) * 20); g.stroke();
  g.fillStyle = "#C3CACD"; g.beginPath(); g.ellipse(bowlP.x, bowlP.y, 26, 17, a, 0, 7); g.fill();
  g.fillStyle = full ? SAUCE.c : "#EEF2F3"; g.beginPath(); g.ellipse(bowlP.x, bowlP.y, 20, 12, a, 0, 7); g.fill();
  return { x: hx, y: hy };
}
function glassOfSpoons(n) {
  const { x, y } = GLASS;
  for (let k = 0; k < n; k++) teaspoon({ x: x - 20 + k * 22, y: y - 140 + (k % 2) * 8 }, -Math.PI / 2 - 0.15 + k * 0.15, false);
  g.fillStyle = "rgba(210,235,245,.55)"; rr(x - 42, y - 92, 84, 92, 10); g.fill();
  g.strokeStyle = "rgba(150,175,185,.9)"; g.lineWidth = 3; g.stroke();
}
function usedBowl(spoonIn) {
  const { x, y } = USED;
  g.fillStyle = "rgba(0,0,0,.12)"; g.beginPath(); g.ellipse(x, y + 32, 76, 10, 0, 0, 7); g.fill();
  g.fillStyle = "#6E787C"; g.beginPath(); g.ellipse(x, y - 6, 72, 15, 0, 0, 7); g.fill();
  g.fillStyle = "#59636A"; g.beginPath(); g.ellipse(x, y - 4, 64, 10, 0, 0, 7); g.fill();
  if (spoonIn) teaspoon({ x: x - 28, y: y - 6 }, Math.PI + 0.25, false);
  const s = g.createLinearGradient(x - 72, 0, x + 72, 0); s.addColorStop(0, "#9AA4A8"); s.addColorStop(0.5, "#EEF2F3"); s.addColorStop(1, "#8D979B");
  g.fillStyle = s; g.beginPath(); g.moveTo(x - 72, y - 2); g.quadraticCurveTo(x - 62, y + 38, x, y + 40); g.quadraticCurveTo(x + 62, y + 38, x + 72, y - 2); g.quadraticCurveTo(x, y + 12, x - 72, y - 2); g.fill();
}
function openMouth(t, k) {
  if (k <= 0) return;
  const m = mouthAt(t);
  g.fillStyle = "#5A2418"; g.beginPath(); g.ellipse(m.x, m.y + 2, 11 * k, 8 * k, 0, 0, 7); g.fill();
}

// a hand with the index finger pointing along angle a; the last part of the finger can be coloured (sauce)
const FINGER = 72;
function pointingHand(p, a, tip) {
  const fx = p.x + Math.cos(a) * FINGER, fy = p.y + Math.sin(a) * FINGER;
  g.lineCap = "round";
  g.strokeStyle = SKIN_D; g.lineWidth = 26; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(fx, fy); g.stroke();
  g.strokeStyle = SKIN; g.lineWidth = 21; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(fx, fy); g.stroke();
  if (tip) {
    g.strokeStyle = tip; g.lineWidth = 21;
    g.beginPath(); g.moveTo(p.x + Math.cos(a) * (FINGER - 22), p.y + Math.sin(a) * (FINGER - 22)); g.lineTo(fx, fy); g.stroke();
  }
  g.fillStyle = SKIN; g.beginPath(); g.ellipse(p.x, p.y, 30, 25, a, 0, 7); g.fill();     // closed fist
  g.strokeStyle = SKIN_D; g.lineWidth = 2;
  g.beginPath(); g.ellipse(p.x, p.y, 30, 25, a, 0.6, 2.4); g.stroke();
  return { x: fx, y: fy };
}
// hand position so that the finger tip lands on `tip` when pointing along angle a
const handFor = (tip, a) => ({ x: tip.x - Math.cos(a) * FINGER, y: tip.y - Math.sin(a) * FINGER });

// ---------- the timeline (seconds) ----------
// 0-2.0 stir, left hand on the pot handle | 2.0-2.8 left hand over the pot, finger out | 2.8-3.6 finger dipped
// 3.6-5.0 finger up to the mouth | 5.0-6.0 finger licked | 6.0-7.2 the same finger back into the pot
// 7.2-8.5 finger stirs in the sauce | 8.5-9.5 hold (finger still in the pot)
const DOWN = Math.PI / 2, UPA = -Math.PI / 2 + 0.25;
function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  zoom();
  background(t); person(t); counter(); hob();
  glassOfSpoons(3); usedBowl(false);
  potBack(); steam(t);

  // right hand stirs all the time (slower near the end, still for the last second)
  const st = Math.min(t, 8.5) * 2.2;
  const spoonTip = { x: 690 + Math.cos(st) * 60, y: SAUCE.y + Math.sin(st) * 10 };
  const rh = { x: 790 + Math.cos(st) * 30, y: 372 + Math.sin(st) * 6 };
  cookSpoon(rh, spoonTip); ripple(spoonTip);

  // left hand: handle -> finger dip -> mouth -> back into the pot
  const DIP1 = { x: 560, y: SAUCE.y }, DIP2 = { x: 585, y: SAUCE.y };
  const m = mouthAt(t), LICK = { x: m.x - 4, y: m.y + 4 };
  let tip, a, sauceOn = false, inSauce = false, mouthK = 0, holding = false;
  if (t < 2.0) { holding = true; }
  else if (t < 2.8) { a = DOWN; tip = L(handFor({ x: HANDLE_L.x, y: HANDLE_L.y }, DOWN), { x: DIP1.x, y: DIP1.y - 70 }, ease(ph(t, 2.0, 2.8))); }
  else if (t < 3.6) {
    a = DOWN; const k = ph(t, 2.8, 3.6), d = k < 0.4 ? ease(k / 0.4) : k < 0.7 ? 1 : 1 - ease((k - 0.7) / 0.3);
    tip = { x: DIP1.x, y: DIP1.y - 70 + d * 70 }; inSauce = d > 0.85; sauceOn = k >= 0.5;
  } else if (t < 5.0) {
    const k = ease(ph(t, 3.6, 5.0)); a = lerp(DOWN, UPA, k); // turn the finger up towards the mouth
    tip = L({ x: DIP1.x, y: DIP1.y - 70 }, LICK, k); sauceOn = true; mouthK = ph(t, 4.6, 5.0);
  } else if (t < 6.0) {
    a = UPA; const k = ph(t, 5.0, 6.0);
    tip = { x: LICK.x, y: LICK.y - 10 * Math.abs(Math.sin(k * Math.PI * 2)) }; sauceOn = k < 0.35; mouthK = 1 - ph(t, 5.8, 6.0);
  } else if (t < 7.2) {
    const k = ease(ph(t, 6.0, 7.2)); a = lerp(UPA, DOWN, k);
    tip = L(LICK, DIP2, k); tip.y -= Math.sin(k * Math.PI) * 40; inSauce = k > 0.95;
  } else {
    a = DOWN; const k = ph(t, 7.2, 8.5);
    tip = { x: DIP2.x + Math.sin(k * Math.PI * 2) * 22, y: DIP2.y + Math.sin(k * Math.PI * 4) * 4 }; inSauce = true;
  }

  // left arm and hand are drawn over the head while licking, so draw the open mouth first
  openMouth(t, mouthK);
  if (holding) {
    arm(LS, HANDLE_L, -1); hand(HANDLE_L, true);
  } else {
    const p = handFor(tip, a);
    arm(LS, p, -1);
    pointingHand(p, a, sauceOn ? SAUCE.c : null);
    if (inSauce) ripple(tip, 0.8);
  }
  arm(RS, rh, 1); hand(rh, true);
}
window.render = render;
render(0);
</script></body></html>
