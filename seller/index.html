<!doctype html>
<!--
  seller/index.html - the seller app ("Kartak Codes"), served at https://kartak-seller.vercel.app/.

  Purpose:    Shell for the page only the seller (Wessam) uses: make a code for each person who pays,
              send it on WhatsApp, reset it for a new phone, turn it off or delete it.
              Deployed as its own Vercel project (root directory "seller") so it installs as a separate
              app with its own icon (decision D12).
  Depends on: css/seller.css, js/seller.js, manifest.webmanifest, icons/, sw.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kartak Codes</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#8A4B0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kartak Codes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/css/seller.css">
</head>
<body>
<div class="page" id="app"></div>
<script src="/js/seller.js"></script>

</body>
</html>
